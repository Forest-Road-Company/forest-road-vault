[package]
name = "forestroad-curator-vault"
version = "0.1.0"
description = "Created with Anchor"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "forestroad_curator_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = "1.2.0"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dev-dependencies]
base64 = "0.22"
litesvm = "0.16"
litesvm-token = "0.16"
proptest = "1"
serde_json = "1"
sha2 = "0.10"
solana-account = "4.3"
solana-address = "2.6"
solana-clock = "3.1"
solana-instruction = "3.4"
solana-keypair = "3.1"
solana-message = "4.2"
solana-program-pack = "3.1"
solana-sdk-ids = "3"
solana-signer = "3.0"
solana-sysvar = "4.1"
solana-transaction = "4.1"
spl-token-interface = "3.0"
